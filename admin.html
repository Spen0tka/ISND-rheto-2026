<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ADMIN</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#161b26; --muted:#6b7385; --line:#e1e4ea; --accent:#2f5bea; --ok:#12805c; --err:#c0392b; --radius:12px; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  .hidden { display:none !important; }
  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:10px 18px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:#e8ebf1; color:var(--ink); }
  button.danger { background:var(--err); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  label { display:block; font-size:.8rem; color:var(--muted); margin:0 0 4px; }

  /* Connexion */
  #login { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; }
  #login h1 { margin:0; font-size:clamp(3.5rem, 16vw, 8rem); font-weight:800; letter-spacing:.18em; padding-left:.18em; line-height:1; }
  #login form { width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }
  #repoRow input { margin-top:4px; }
  #loginErr { color:var(--err); font-size:.9rem; min-height:1.3em; text-align:center; }

  /* App */
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header strong { font-size:1.3rem; letter-spacing:.18em; font-weight:800; }
  header .who { color:var(--muted); font-size:.85rem; flex:1; text-align:right; }
  nav { display:flex; gap:6px; max-width:900px; margin:20px auto 0; padding:0 16px; }
  nav button { background:#e8ebf1; color:var(--ink); }
  nav button.on { background:var(--ink); color:#fff; }
  main { max-width:900px; margin:0 auto; padding:16px 16px 80px; }
  section.box { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
  h2 { margin:0 0 14px; font-size:1.05rem; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px){ .row { grid-template-columns:1fr; } }
  .newcat { display:grid; grid-template-columns:90px 1fr; gap:12px; margin-top:12px; }

  #drop { margin-top:16px; border:2px dashed #b8bfcd; border-radius:var(--radius); padding:34px 16px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  #drop.over { border-color:var(--accent); background:#eef2ff; color:var(--accent); }

  .card { display:grid; grid-template-columns:120px 1fr; gap:16px; padding:16px 0; border-top:1px solid var(--line); }
  .card:first-child { border-top:0; }
  @media (max-width:600px){ .card { grid-template-columns:1fr; } }
  .card img.pv { width:120px; height:120px; object-fit:cover; border-radius:8px; background:#e8ebf1; }
  .fields { display:grid; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .chips:focus-within { outline:2px solid var(--accent); outline-offset:-1px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#e8edff; color:#1f3fb8; border-radius:99px; padding:2px 6px 2px 10px; font-size:.85rem; }
  .chip button { padding:0 4px; background:none; color:inherit; font-size:1rem; line-height:1; }
  .chips input { flex:1; min-width:140px; border:0; padding:4px; outline:0 !important; }
  .final { font:.8rem ui-monospace,Menlo,Consolas,monospace; color:var(--muted); word-break:break-all; }
  .final.bad { color:var(--err); }
  .cardActions { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .linkbtn { background:none; color:var(--accent); padding:0; font-weight:500; font-size:.85rem; }
  .st { font-size:.85rem; }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  #q { font-size:1.05rem; padding:12px 14px; }
  #results { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-top:16px; }
  .res { background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; }
  .res img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#e8ebf1; display:block; }
  .res .meta { padding:10px 12px; font-size:.85rem; flex:1; }
  .res .t { font-weight:600; }
  .res .s, .res .c { color:var(--muted); }
  .res button { margin:0 12px 12px; padding:7px; font-size:.85rem; }
  .hint { color:var(--muted); font-size:.9rem; margin-top:12px; }

  dialog { border:0; border-radius:var(--radius); padding:20px; max-width:min(520px,92vw); }
  dialog::backdrop { background:rgba(10,14,25,.55); }
  dialog img { width:100%; max-height:50vh; object-fit:contain; border-radius:8px; background:#e8ebf1; }
  dialog p { word-break:break-word; }
  dialog .bar { justify-content:flex-end; }

  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; display:none; max-width:92vw; z-index:20; }
  #toast.ok { background:var(--ok); } #toast.err { background:var(--err); }
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->
<div id="login">
  <h1>ADMIN</h1>
  <form id="loginForm" autocomplete="off">
    <input id="token" type="password" placeholder="Token GitHub" autocomplete="off" required>
    <div id="repoRow" class="hidden">
      <label for="repoIn">Dépôt (impossible à deviner depuis cette adresse)</label>
      <input id="repoIn" placeholder="utilisateur/nom-du-depot">
    </div>
    <button type="submit" id="loginBtn">Entrer</button>
    <div id="loginErr"></div>
  </form>
</div>

<!-- ============ APPLICATION ============ -->
<div id="app" class="hidden">
  <header>
    <strong>ADMIN</strong>
    <span class="who" id="who"></span>
    <button class="ghost" id="logout">Déconnexion</button>
  </header>
  <nav>
    <button id="tabAdd" class="on">Ajouter des photos</button>
    <button id="tabDel">Supprimer une photo</button>
  </nav>

  <main>
    <!-- Ajout -->
    <div id="paneAdd">
      <section class="box">
        <h2>Catégorie</h2>
        <label for="cat">Dossier de destination</label>
        <select id="cat"></select>
        <div id="newCat" class="newcat hidden">
          <div><label for="catNum">Ordre</label><input id="catNum" type="number" min="0" max="99" step="1"></div>
          <div><label for="catName">Nom de la catégorie</label><input id="catName" placeholder="ex : Voyage"></div>
        </div>
        <div class="final" id="catPreview" style="margin-top:10px"></div>
      </section>

      <section class="box">
        <h2>Photos</h2>
        <div id="drop">Glissez-déposez vos photos ici<br><small>ou cliquez pour parcourir</small></div>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
        <div id="cards"></div>
        <div class="bar hidden" id="addBar">
          <button id="sendAll">Téléverser tout</button>
          <button id="clearAll" class="ghost">Vider la liste</button>
        </div>
      </section>
    </div>

    <!-- Suppression -->
    <div id="paneDel" class="hidden">
      <section class="box">
        <h2>Rechercher une photo</h2>
        <input id="q" type="search" placeholder="Nom d'élève, titre, date…">
        <div class="hint" id="count"></div>
        <div id="results"></div>
      </section>
    </div>
  </main>
</div>

<datalist id="knownStudents"></datalist>

<dialog id="confirm">
  <h2>Supprimer cette photo ?</h2>
  <img id="cImg" alt="">
  <p id="cName"></p>
  <div class="bar">
    <button class="ghost" id="cNo">Annuler</button>
    <button class="danger" id="cYes">Supprimer définitivement</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
(() => {
  /* ---------- Réglages (facultatif : forcer ici si l'adresse du site ne permet pas de les deviner) ---------- */
  const CONFIG = {
    owner: 'spen0tka',
    repo: 'ISND-rheto-2026',
    branch: '',           // vide = branche par défaut du dépôt
    photosDir: 'photos',
    siteBase: '',         // vide = dossier où se trouve admin.html
    studentSep: ', '      // séparateur entre élèves dans les crochets
  };

  const $ = id => document.getElementById(id);
  const API = 'https://api.github.com';
  const IMG_RE = /\.(jpe?g|png|webp)$/i; // formats lus par build.py
  const S = { token:'', owner:'', repo:'', branch:'', photos:[], cats:new Set(), students:new Set(), queue:[] };

  /* ---------- Utilitaires ---------- */
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const clean = s => s.replace(/[\\\/:*?"<>|\[\]#%]/g, ' ').replace(/\s+/g, ' ').trim();
  const cleanStudent = s => clean(s.replace(/,/g, ' '));
  const encPath = p => p.split('/').map(encodeURIComponent).join('/');
  const extOf = n => (n.match(/\.[^.]+$/) || [''])[0].toLowerCase();
  const stripExt = n => n.replace(/\.[^.]+$/, '');
  const isoDate = ts => new Date(ts).toLocaleDateString('sv-SE');
  const mime = n => ({ '.jpg':'image/jpeg', '.jpeg':'image/jpeg', '.png':'image/png', '.gif':'image/gif', '.webp':'image/webp', '.avif':'image/avif', '.heic':'image/heic' })[extOf(n)] || 'application/octet-stream';
  const catSort = (a, b) => a.localeCompare(b, 'fr', { numeric:true });

  function toast(msg, type = '') {
    const t = $('toast'); t.textContent = msg; t.className = type; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', type === 'err' ? 8000 : 3500);
  }

  async function gh(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        Authorization: 'Bearer ' + S.token,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.body ? { 'Content-Type':'application/json' } : {})
      }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.message || res.statusText); e.status = res.status; throw e; }
    return data;
  }
  const repoUrl = p => `/repos/${S.owner}/${S.repo}${p}`;
  const fileToB64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = ko; r.readAsDataURL(f); });

  /* ---------- Nom de fichier : aaaa-mm-jj_Titre [Nom Prenom, Nom Prenom].ext ---------- */
  function buildName(it) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(it.date)) return { err:'Date invalide' };
    const title = clean(it.title);
    if (!title) return { err:'Titre manquant' };
    const studs = it.students.map(cleanStudent).filter(Boolean);
    const name = `${it.date}_${title}${studs.length ? ` [${studs.join(CONFIG.studentSep)}]` : ''}${extOf(it.file.name)}`;
    if (new TextEncoder().encode(name).length > 200) return { err:'Nom trop long (raccourcissez le titre ou les élèves)' };
    return { name };
  }
  function parseName(file) {
    const base = stripExt(file);
    const m = base.match(/^(\d{4}-\d{2}-\d{2})_(.*?)(?:\s*\[(.*)\])?$/);
    if (!m) return { date:'', title:base, students:[] };
    return { date:m[1], title:m[2].trim(), students:(m[3] || '').split(',').map(s => s.trim()).filter(Boolean) };
  }

  /* ---------- Connexion ---------- */
  function inferRepo() {
    if (CONFIG.owner && CONFIG.repo) return { owner:CONFIG.owner, repo:CONFIG.repo };
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    if (!m) return null;
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return { owner:m[1], repo:(seg && !/\.html?$/i.test(seg)) ? seg : `${m[1]}.github.io` };
  }

  async function login(token) {
    $('loginErr').textContent = '';
    let r = inferRepo();
    if (!r) {
      const v = ($('repoIn').value || localStorage.getItem('admin_repo') || '').trim().split('/');
      if (v.length !== 2 || !v[0] || !v[1]) { $('repoRow').classList.remove('hidden'); $('loginErr').textContent = 'Indiquez le dépôt (utilisateur/nom).'; return false; }
      r = { owner:v[0], repo:v[1] };
    }
    S.token = token; S.owner = r.owner; S.repo = r.repo;
    try {
      const user = await gh('/user');
      const repo = await gh(repoUrl(''));
      if (!repo.permissions || !repo.permissions.push) throw Object.assign(new Error("Ce token n'a pas le droit d'écrire dans ce dépôt."), { status:403 });
      S.branch = CONFIG.branch || repo.default_branch;
      sessionStorage.setItem('admin_token', token);
      if (!inferRepo()) localStorage.setItem('admin_repo', `${r.owner}/${r.repo}`);
      $('who').textContent = `${user.login} · ${r.owner}/${r.repo}`;
      await loadPhotos();
      $('login').classList.add('hidden'); $('app').classList.remove('hidden');
      $('token').value = '';
      return true;
    } catch (e) {
      sessionStorage.removeItem('admin_token');
      $('loginErr').textContent = e.status === 401 ? 'Token invalide ou expiré.'
        : e.status === 404 ? 'Dépôt introuvable, ou token sans accès à ce dépôt.'
        : e.message;
      return false;
    }
  }
  function logout() {
    sessionStorage.removeItem('admin_token'); S.token = '';
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    S.queue = []; $('cards').innerHTML = ''; syncBar();
  }

  /* ---------- Lecture du dépôt (une seule requête : l'arbre Git) ---------- */
  async function loadPhotos() {
    const tree = await gh(repoUrl(`/git/trees/${encodeURIComponent(S.branch)}?recursive=1`));
    if (tree.truncated) toast('Dépôt très volumineux : la liste peut être incomplète.', 'err');
    const root = CONFIG.photosDir + '/';
    S.photos = []; S.cats = new Set(); S.students = new Set();
    for (const e of tree.tree) {
      if (!e.path.startsWith(root)) continue;
      const rel = e.path.slice(root.length).split('/');
      if (e.type === 'tree' && rel.length === 1) S.cats.add(rel[0]);
      if (e.type === 'blob' && IMG_RE.test(e.path)) {
        const cat = rel.length > 1 ? rel[0] : '';
        const name = rel[rel.length - 1];
        if (cat) S.cats.add(cat);
        S.photos.push({ path:e.path, sha:e.sha, cat, name });
        parseName(name).students.forEach(s => S.students.add(s));
      }
    }
    refreshCats(); refreshStudents(); renderResults();
  }

  /* ---------- Catégories ---------- */
  const NEW = '__new__';
  function nextNum() {
    let max = 0; S.cats.forEach(c => { const m = c.match(/^(\d+)/); if (m) max = Math.max(max, +m[1]); });
    return String(max + 1).padStart(2, '0');
  }
  function refreshCats() {
    const cur = $('cat').value;
    const list = [...S.cats].sort(catSort);
    $('cat').innerHTML = list.map(c => `<option></option>`).join('') + `<option value="${NEW}">➕ Nouvelle catégorie…</option>`;
    [...$('cat').options].slice(0, list.length).forEach((o, i) => { o.value = o.textContent = list[i]; });
    $('cat').value = list.includes(cur) || cur === NEW ? cur : (list[0] || NEW);
    $('catNum').value = $('catNum').value || nextNum();
    onCatChange();
  }
  function currentCat() {
    if ($('cat').value !== NEW) return $('cat').value;
    const num = String(parseInt($('catNum').value, 10)).padStart(2, '0');
    const name = clean($('catName').value);
    return (num === 'NaN' || !name) ? '' : `${num} ${name}`;
  }
  function onCatChange() {
    const isNew = $('cat').value === NEW;
    $('newCat').classList.toggle('hidden', !isNew);
    const c = currentCat();
    const clash = isNew && c && [...S.cats].some(x => x.startsWith(c.slice(0, 2) + ' '));
    $('catPreview').textContent = c ? `${CONFIG.photosDir}/${c}/` + (clash ? '   ⚠ ce numéro d\'ordre est déjà utilisé' : '') : '';
  }

  /* ---------- Élèves connus (autocomplétion) ---------- */
  function refreshStudents() {
    $('knownStudents').innerHTML = [...S.students].sort((a, b) => a.localeCompare(b, 'fr')).map(s => `<option value="${s.replace(/"/g, '&quot;')}">`).join('');
  }

  /* ---------- Cartes d'upload ---------- */
  function addCard(file) {
    const it = { file, date:isoDate(file.lastModified), title:'', students:[], status:'', done:false };
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `
      <img class="pv" alt="">
      <div class="fields">
        <div class="row">
          <div><label>Date</label><input type="date" class="d"></div>
          <div><label>Titre de la photo</label><input type="text" class="t" placeholder="ex : Visite du musée"></div>
        </div>
        <div><label>Élèves présents (Entrée pour valider chaque nom)</label>
          <div class="chips"><span class="list"></span><input class="s" list="knownStudents" placeholder="Nom Prénom"></div></div>
        <div class="final"></div>
        <div class="cardActions">
          <button class="linkbtn copy" type="button">Copier date + élèves vers les autres photos</button>
          <button class="linkbtn rm" type="button">Retirer</button>
          <span class="st"></span>
        </div>
      </div>`;
    const q = s => el.querySelector(s);
    q('.pv').src = URL.createObjectURL(file);
    q('.d').value = it.date;
    q('.d').oninput = e => { it.date = e.target.value; upd(); };
    q('.t').oninput = e => { it.title = e.target.value; upd(); };
    const chipsIn = q('.s');
    const addStudent = () => {
      const v = cleanStudent(chipsIn.value); chipsIn.value = '';
      if (v && !it.students.includes(v)) { it.students.push(v); S.students.add(v); drawChips(); upd(); }
    };
    chipsIn.onkeydown = e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addStudent(); } else if (e.key === 'Backspace' && !chipsIn.value && it.students.length) { it.students.pop(); drawChips(); upd(); } };
    chipsIn.onchange = addStudent; chipsIn.onblur = addStudent;
    function drawChips() {
      const box = q('.list'); box.innerHTML = '';
      it.students.forEach((s, i) => {
        const c = document.createElement('span'); c.className = 'chip';
        const t = document.createElement('span'); t.textContent = s;
        const b = document.createElement('button'); b.type = 'button'; b.textContent = '×';
        b.onclick = () => { it.students.splice(i, 1); drawChips(); upd(); };
        c.append(t, b); box.append(c);
      });
    }
    function upd() {
      const r = buildName(it); const f = q('.final');
      f.textContent = r.name || '⚠ ' + r.err; f.classList.toggle('bad', !r.name);
    }
    q('.copy').onclick = () => {
      S.queue.forEach(o => { if (o !== it && !o.done) { o.date = it.date; o.students = [...it.students]; o.refresh(); } });
      toast('Date et élèves copiés.', 'ok');
    };
    q('.rm').onclick = () => { S.queue = S.queue.filter(o => o !== it); el.remove(); syncBar(); };
    it.el = el; it.setStatus = (txt, cls = '') => { const s = q('.st'); s.textContent = txt; s.className = 'st ' + cls; };
    it.refresh = () => { q('.d').value = it.date; drawChips(); upd(); };
    it.refresh();
    $('cards').append(el); S.queue.push(it); syncBar();
  }
  function syncBar() { $('addBar').classList.toggle('hidden', !S.queue.length); }
  function handleFiles(files) {
    [...files].forEach(f => {
      if (!IMG_RE.test(f.name)) return toast(`${f.name} : format non accepté (JPG, PNG ou WebP uniquement).`, 'err');
      if (f.size > 25 * 1024 * 1024) return toast(`${f.name} dépasse 25 Mo.`, 'err');
      addCard(f);
    });
  }

  async function sendAll() {
    const cat = currentCat();
    if (!cat) return toast('Choisissez ou créez une catégorie (numéro + nom).', 'err');
    const todo = S.queue.filter(i => !i.done);
    const bad = todo.filter(i => buildName(i).err);
    if (bad.length) { bad[0].el.scrollIntoView({ behavior:'smooth', block:'center' }); return toast(`${bad.length} photo(s) incomplète(s) : date et titre sont obligatoires.`, 'err'); }
    $('sendAll').disabled = true; let ok = 0;
    for (const it of todo) { // séquentiel : un commit après l'autre, pas de conflit
      try {
        let name = buildName(it).name, path = `${CONFIG.photosDir}/${cat}/${name}`;
        const taken = p => S.photos.some(x => x.path.toLowerCase() === p.toLowerCase());
        for (let n = 2; taken(path); n++) { name = buildName(it).name.replace(/(\.[^.]+)$/, ` (${n})$1`); path = `${CONFIG.photosDir}/${cat}/${name}`; }
        it.setStatus('envoi…');
        const res = await gh(repoUrl(`/contents/${encPath(path)}`), {
          method:'PUT', body:JSON.stringify({ message:`Ajout : ${path}`, content:await fileToB64(it.file), branch:S.branch })
        });
        S.photos.push({ path, sha:res.content.sha, cat, name }); S.cats.add(cat);
        it.students.forEach(s => S.students.add(s));
        it.done = true; ok++; it.setStatus('✔ ' + name, 'ok');
        it.el.querySelectorAll('input,button.copy,button.rm').forEach(x => x.disabled = true);
      } catch (e) { it.setStatus('✖ ' + e.message, 'err'); }
    }
    $('sendAll').disabled = false;
    refreshCats(); refreshStudents(); renderResults();
    if ($('cat').value === NEW && ok) { $('cat').value = cat; onCatChange(); $('catName').value = ''; $('catNum').value = nextNum(); }
    toast(`${ok} photo(s) ajoutée(s). Le site sera à jour dans 1 à 2 minutes.`, ok === todo.length ? 'ok' : 'err');
  }

  /* ---------- Recherche + suppression ---------- */
  const SITE_BASE = () => CONFIG.siteBase || new URL('./', location.href).href;
  function setThumb(img, p) {
    img.loading = 'lazy';
    img.src = new URL(encPath(p.path), SITE_BASE()).href;
    img.onerror = async () => { // pas encore publié par Pages : on lit le fichier via l'API
      img.onerror = null;
      try { const b = await gh(repoUrl(`/git/blobs/${p.sha}`)); img.src = `data:${mime(p.name)};base64,${b.content.replace(/\s/g, '')}`; }
      catch { img.alt = 'aperçu indisponible'; }
    };
  }
  function renderResults() {
    const q = norm($('q').value.trim()), box = $('results'); box.innerHTML = '';
    if (!q) { $('count').textContent = `${S.photos.length} photo(s) dans le dépôt. Tapez un nom, un titre ou une date.`; return; }
    const terms = q.split(/\s+/);
    const hits = S.photos.filter(p => terms.every(t => norm(p.name).includes(t))).sort((a, b) => b.name.localeCompare(a.name));
    $('count').textContent = hits.length ? `${hits.length} résultat(s)` + (hits.length > 48 ? ' — 48 affichés, affinez la recherche.' : '') : 'Aucune photo ne correspond.';
    hits.slice(0, 48).forEach(p => {
      const info = parseName(p.name);
      const d = document.createElement('div'); d.className = 'res';
      d.innerHTML = '<img alt=""><div class="meta"><div class="t"></div><div class="s"></div><div class="c"></div></div><button class="danger" type="button">Supprimer</button>';
      setThumb(d.querySelector('img'), p);
      d.querySelector('.t').textContent = info.title;
      d.querySelector('.s').textContent = [info.date, info.students.join(', ')].filter(Boolean).join(' · ');
      d.querySelector('.c').textContent = p.cat || '(racine)';
      d.querySelector('button').onclick = () => askDelete(p);
      box.append(d);
    });
  }
  let pending = null;
  function askDelete(p) {
    pending = p; setThumb($('cImg'), p);
    $('cName').textContent = `${p.cat}/${p.name}`;
    $('confirm').showModal();
  }
  async function doDelete() {
    const p = pending; if (!p) return;
    $('cYes').disabled = true;
    try {
      await gh(repoUrl(`/contents/${encPath(p.path)}`), { method:'DELETE', body:JSON.stringify({ message:`Suppression : ${p.path}`, sha:p.sha, branch:S.branch }) });
      S.photos = S.photos.filter(x => x !== p); renderResults();
      toast('Photo supprimée.', 'ok');
    } catch (e) { toast(e.status === 409 || e.status === 422 ? 'La photo a changé sur GitHub : relancez la page.' : e.message, 'err'); }
    $('cYes').disabled = false; $('confirm').close(); pending = null;
  }

  /* ---------- Événements ---------- */
  $('loginForm').onsubmit = async e => { e.preventDefault(); $('loginBtn').disabled = true; await login($('token').value.trim()); $('loginBtn').disabled = false; };
  $('logout').onclick = logout;
  $('tabAdd').onclick = () => { $('paneAdd').classList.remove('hidden'); $('paneDel').classList.add('hidden'); $('tabAdd').classList.add('on'); $('tabDel').classList.remove('on'); };
  $('tabDel').onclick = () => { $('paneDel').classList.remove('hidden'); $('paneAdd').classList.add('hidden'); $('tabDel').classList.add('on'); $('tabAdd').classList.remove('on'); $('q').focus(); };
  $('cat').onchange = onCatChange; $('catNum').oninput = onCatChange; $('catName').oninput = onCatChange;
  $('q').oninput = renderResults;
  $('sendAll').onclick = sendAll;
  $('clearAll').onclick = () => { S.queue = []; $('cards').innerHTML = ''; syncBar(); };
  $('cNo').onclick = () => { $('confirm').close(); pending = null; };
  $('cYes').onclick = doDelete;

  const drop = $('drop');
  drop.onclick = () => $('file').click();
  $('file').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  // Reconnexion automatique pendant la session de l'onglet
  const saved = sessionStorage.getItem('admin_token');
  if (!inferRepo()) { $('repoRow').classList.remove('hidden'); $('repoIn').value = localStorage.getItem('admin_repo') || ''; }
  if (saved) login(saved);
})();
</script>
</body>
</html>
